# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set AGENT_API_KEY=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Không đặt startCommand ở đây: Dockerfile đã có CMD chạy qua shell
# (`sh -c "uvicorn ... --port ${PORT:-8000}"`), đảm bảo $PORT được
# nội suy đúng. startCommand ghi đè CMD nhưng không chắc được chạy qua
# shell trên mọi builder — nếu $PORT không được nội suy, uvicorn nhận
# chuỗi "$PORT" làm cổng và crash ngay khi khởi động (im lặng hoàn
# toàn, healthcheck luôn "service unavailable").
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
