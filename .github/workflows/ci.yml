name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # test_cp5.py gọi vào service đã deploy thật (cần Internet + URL sống),
      # chạy nó trong CI luôn đỏ vì không có bản deploy nào tồn tại tại thời
      # điểm test chạy. test_bonus_cicd.py tự kiểm tra badge của chính workflow
      # này — chạy nó bên trong workflow là vòng lặp tự tham chiếu, chỉ chạy
      # tay ở máy học viên trước khi push.
      - name: Run test suite (bỏ CP5 và bonus tự tham chiếu)
        run: pytest tests/ --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -v

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:${{ github.sha }} .

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test, build]
    # Chỉ deploy khi push thẳng vào main — mở pull request không được kéo
    # theo một lần deploy.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Trigger Railway deploy
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN chua duoc set trong GitHub Secrets (Settings > Secrets and variables > Actions)."
            echo "Bo qua buoc deploy that - Railway van tu deploy qua tich hop GitHub co san."
            exit 0
          fi
          npm install -g @railway/cli
          railway up --service agent
